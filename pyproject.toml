[project]
name = "tools_agent"
version = "0.0.2"
description = "LangGraph tools agent with MCP and a RAG tool"
authors = [
    { name = "langchain-ai" },
]
requires-python = ">=3.11.0,<3.13"
dependencies = [
    "langgraph>=0.6.2",
    "langchain-anthropic>=0.3.18",
    "langchain-core>=0.3.72",
    "langchain-openai>=0.3.28",
    "pydantic==2.11.3",
    "langchain>=0.3.27",
    "mcp>=1.9.1",
    "supabase>=2.15.1",
    "aiohttp>=3.8.0",
    "langgraph-api==0.7.9",
    "deepagents>=0.3.9",
    "tavily-python>=0.7.20",
    "robyn>=0.76.0",
    "apscheduler>=3.11.2",
    "croniter>=6.0.0",
]

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tools_agent*", "robyn_server*"]
exclude = ["robyn_server.tests*", "robyn_server.helm*"]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.3.6",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.8.4",
]

[tool.ruff]
exclude = [
    ".agent",
    ".devops",
    ".github",
    ".langgraph_api",
    ".ruff_cache",
    ".venv",
    ".vscode",
    ".zed",
    "__pycache__",
    "archive",
]
